<style>
:root{
  --bg:#07090d;--panel:#111722;--panel2:#0b1018;--line:#2c3950;--text:#eef3fb;
  --muted:#94a1b5;--gold:#efbc38;--green:#45d48a;--red:#ff6b7a;--orange:#ffb24a;--blue:#72aaff;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#121a28 0,#07090d 45%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
.wrap{max-width:780px;margin:auto;padding:18px 14px 64px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:28px;margin:5px 0 6px}
.sub{color:var(--muted);line-height:1.55;font-size:14px}
.panel{background:rgba(17,23,34,.96);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 8px 24px #0005}
.apikey{display:flex;gap:8px}
input{width:100%;min-width:0;background:#070b11;border:1px solid #33425b;color:white;border-radius:12px;padding:12px;font-size:15px}
button{cursor:pointer}
.btn{border:0;border-radius:14px;background:linear-gradient(135deg,#b67c0b,#f0c64a);color:#111;padding:15px 18px;font-weight:900;font-size:17px}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.filters label{font-size:12px;color:var(--muted)}
.status{margin-top:14px;padding:13px 14px;border-radius:14px;background:#111827;border:1px solid var(--line);color:#d3dbe7;line-height:1.5}
.status.ok{background:#0c281d;border-color:#245d46;color:#b9f3d5}
.status.err{background:#2b1218;border-color:#71313d;color:#ffc1c9}
.card{position:relative;background:linear-gradient(180deg,#111722,#0d121a);border:1px solid #35445f;border-radius:20px;padding:16px;margin-top:15px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,#d7a92d,transparent)}
.rank{position:absolute;right:15px;top:14px;font-size:28px;font-weight:900;color:#e8bd4b}
.head{padding-right:70px}
.ticker{font-size:26px;font-weight:950;letter-spacing:.4px}
.name{color:var(--muted);font-size:13px;margin-top:2px}
.price{font-size:28px;font-weight:900;margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#1a2536;color:#dfe9f7;font-size:12px;font-weight:800;border:1px solid #2e3e56}
.badge.green{background:#0e2a1e;color:#8ff0bd;border-color:#22563f}
.badge.red{background:#2b151a;color:#ff9cab;border-color:#66313b}
.badge.orange{background:#2a2010;color:#ffd080;border-color:#6d5322}
.badge.blue{background:#12243b;color:#9ac7ff;border-color:#274f7a}
.scorebox{margin-top:13px;background:#0a0f16;border:1px solid #26364d;border-radius:15px;padding:12px}
.scoreline{display:flex;justify-content:space-between;align-items:end;gap:10px}
.score{font-size:38px;font-weight:950}
.grade{font-weight:900;padding:6px 9px;border-radius:9px;background:#1a2638;color:#d9e8ff}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.metric{background:#0a0f16;border:1px solid #243249;border-radius:13px;padding:10px}
.metric small{display:block;color:#8593a8;font-size:11px;margin-bottom:4px}
.metric b{font-size:15px}
.section{margin-top:13px;border-top:1px dashed #344158;padding-top:12px}
.section h3{font-size:14px;margin:0 0 8px;color:#c7d5e8}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0;font-size:13px}
.row span:first-child{color:#93a0b4}
.row b{text-align:right}
.reason{font-size:13px;line-height:1.65;color:#dce5f2}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.level{background:#0b1119;border:1px solid #27364d;border-radius:12px;padding:10px}
.level small{display:block;color:#8b99ad;font-size:11px}
.level b{font-size:15px}
.warnbox{margin-top:10px;padding:10px 11px;border-radius:12px;background:#26171a;border:1px solid #66333b;color:#ffb8c2;font-size:12px;line-height:1.55}
.goodbox{margin-top:10px;padding:10px 11px;border-radius:12px;background:#0d241a;border:1px solid #285743;color:#aef0cf;font-size:12px;line-height:1.55}
.explain{font-size:12px;color:#8996aa;line-height:1.6;margin-top:9px}
.progress{height:8px;background:#101723;border-radius:999px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#7f5b12,#eabc3d);width:0}
.small{font-size:12px;color:#8996aa;line-height:1.55}

.signalbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.signal{padding:7px 10px;border-radius:10px;font-size:12px;font-weight:900;border:1px solid #34445e}
.signal.hot{background:#351316;border-color:#7a2d38;color:#ff9aa8}
.signal.vol{background:#2c2010;border-color:#6c4c1d;color:#ffd079}
.signal.acc{background:#0e2a1e;border-color:#245d44;color:#8cf0bd}
.signal.high{background:#12243b;border-color:#2b527d;color:#9dcbff}
.signal.safe{background:#142419;border-color:#315d3f;color:#b9f2cd}
.signal.risk{background:#32161a;border-color:#7b3440;color:#ffadb8}
.alertgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.alertitem{background:#0a0f16;border:1px solid #26364d;border-radius:12px;padding:10px}
.alertitem small{display:block;color:#8795aa;font-size:11px;margin-bottom:4px}
.alertitem b{font-size:14px}

@media(min-width:620px){.metrics{grid-template-columns:repeat(4,1fr)}.levels{grid-template-columns:repeat(4,1fr)}}

.top5box{margin-top:14px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#2b210c,#121722);border:1px solid #6e5420}
.top5box b{color:#ffd35a}
.modehint{margin-top:8px;color:#8fa0b6;font-size:11px;line-height:1.5}

.tripleScore{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.tripleScore .metric b{font-size:16px}
.filterpass{margin-top:9px;padding:9px 10px;border-radius:11px;background:#0d241a;border:1px solid #285743;color:#aef0cf;font-size:11px;font-weight:850}
.filterfail{margin-top:9px;padding:9px 10px;border-radius:11px;background:#2a1519;border:1px solid #6b323c;color:#ffb7c0;font-size:11px;font-weight:850}

.explodeBox{margin-top:11px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#24110e,#121722);border:1px solid #6a2d22}
.explodeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}
.explodeGrid .metric b{font-size:15px}
.explodeTitle{font-weight:950;color:#ffb06d}

.marketbox{margin-top:14px;padding:12px;border-radius:14px;background:#0c1d2b;border:1px solid #245277}
.marketbox b{color:#9dd7ff}
.modebadge{display:inline-block;padding:5px 8px;border-radius:999px;background:#10273b;color:#a8d8ff;border:1px solid #28557d;font-size:11px;font-weight:900;margin-top:6px}

.radarbox{margin-top:12px;padding:11px;border-radius:13px;background:#141b26;border:1px solid #32445e}
.radarbox b{color:#ffd76a}.radarlist{margin-top:6px;font-size:11px;color:#a8b5c7;line-height:1.55}

<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>AI 동전주 스캐너 v3.6</h1>
      <div class="sub">후보 자동찾기 + 티커 직접분석 · <b>급등포착/거래량급증/매집의심/돌파·눌림/위험경고</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="small" style="margin-bottom:6px">Twelve Data API Key</div>
    <div class="apikey">
      <input id="apiKey" type="password" placeholder="API key 붙여넣기" autocomplete="off">
      <button class="btn2" id="testKey">키 확인</button>
    </div>

    <div class="filters">
      <label>최소 가격($)<input id="minp" type="number" step="0.10" value="0.20"></label>
      <label>최대 가격($)<input id="maxp" type="number" step="0.10" value="5.00"></label>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px">
      <button class="btn" id="scan">8종목 빠른 스캔</button>
      <button class="btn2" id="scan24" style="font-size:15px">24종목 연속 TOP5</button>
    </div>
    <button class="btn" id="marketBtn" style="width:100%;margin-top:9px;background:linear-gradient(135deg,#16486d,#56b4ff);color:white">🌎 오늘 전체시장 자동발굴</button>
    <button class="btn" id="explodeBtn" style="width:100%;margin-top:9px;background:linear-gradient(135deg,#7b1f14,#ff7a34);color:white">🔥 폭발직전 TOP5</button>
    <div class="small" style="margin-top:9px">
      🌎 <b>오늘 전체시장 자동발굴</b>은 Market Movers를 우선 사용하고, 지원되지 않으면 Twelve Data의 전체 미국주식 심볼 목록에서 자동 회전해. 🔥 폭발직전 TOP5는 매집완료 추정 + 압축 + 거래량 유입 + 고점 근접을 따로 선별해.
    </div>

    <div style="border-top:1px dashed #344158;margin-top:14px;padding-top:14px">
      <div class="small" style="margin-bottom:6px">티커 직접 정밀분석</div>
      <div class="apikey">
        <input id="ticker" placeholder="예: HOLO, SILO, CYN" autocapitalize="characters" style="text-transform:uppercase;font-size:17px">
        <button class="btn2" id="analyzeTicker">분석</button>
      </div>
    </div>
  </div>

  <div id="status" class="status">API 키 확인 후 스캔을 눌러줘.</div>
  <div id="out"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const BASE="https://api.twelvedata.com";
let sessionKey="";
function storedKey(){try{return localStorage.getItem("td_api_key")||""}catch(e){return ""}}
$("apiKey").value=storedKey();
function key(){return $("apiKey").value.trim()||sessionKey||storedKey()}
function setStatus(t,c=""){$("status").textContent=t;$("status").className="status "+c}
const n=x=>Number(x), avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const fmt=x=>Number.isFinite(x)?x.toLocaleString(undefined,{maximumFractionDigits:2}):"-";
const money=x=>Number.isFinite(x)?"$"+x.toFixed(x<1?3:2):"-";

async function api(path,p={}){
  const u=new URL(BASE+path);
  Object.entries({...p,apikey:key()}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString());
  const j=await r.json();
  if(!r.ok||j.status==="error"||j.code>=400) throw Error(j.message||("HTTP "+r.status));
  return j;
}

$("testKey").onclick=async()=>{
  const k=key();
  if(!k){setStatus("API 키를 먼저 붙여넣어줘.","err");return}
  sessionKey=k;
  try{
    setStatus("API 키 확인 중…");
    const j=await api("/time_series",{symbol:"AAPL",interval:"1day",outputsize:5});
    if(j.values?.length){
      try{localStorage.setItem("td_api_key",k)}catch(e){}
      setStatus("API 키 정상 ✅ 이제 정밀 스캔을 눌러줘.","ok");
    }else throw Error("데이터 없음");
  }catch(e){setStatus("API 키 오류: "+e.message,"err")}
};

function ema(a,p){
  if(!a.length)return[];
  const k=2/(p+1),o=[a[0]];
  for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));
  return o;
}
function rsi(a,p=14){
  if(a.length<p+1)return NaN;
  let g=0,l=0;
  for(let i=a.length-p;i<a.length;i++){const d=a[i]-a[i-1]; if(d>0)g+=d; else l-=d}
  if(l===0)return 100;
  const rs=(g/p)/(l/p); return 100-100/(1+rs);
}
function atr(rows,p=14){
  const x=[];
  for(let i=1;i<rows.length;i++){
    x.push(Math.max(n(rows[i].high)-n(rows[i].low),Math.abs(n(rows[i].high)-n(rows[i-1].close)),Math.abs(n(rows[i].low)-n(rows[i-1].close))));
  }
  return avg(x.slice(-p));
}
function obv(rows){
  let v=0, arr=[0];
  for(let i=1;i<rows.length;i++){
    const vol=n(rows[i].volume)||0;
    if(n(rows[i].close)>n(rows[i-1].close))v+=vol;
    else if(n(rows[i].close)<n(rows[i-1].close))v-=vol;
    arr.push(v);
  }
  return {value:v,up:arr.length>6&&arr.at(-1)>arr.at(-6)};
}
function analyze(sym,name,values){
  const rows=[...values].reverse();
  const c=rows.map(x=>n(x.close)), vols=rows.map(x=>n(x.volume)||0);
  const last=c.at(-1), prev=c.at(-2), dayChg=(last/prev-1)*100;
  const s20=avg(c.slice(-20)), s50=avg(c.slice(-50));
  const av20=avg(vols.slice(-21,-1)), av60=avg(vols.slice(-61,-1));
  const rv20=av20?vols.at(-1)/av20:0;
  const prevRv20=av20?vols.at(-2)/av20:0;
  const vol5=avg(vols.slice(-6,-1)), volTrend=av20?vol5/av20:0;

  const hi20=Math.max(...rows.slice(-21,-1).map(x=>n(x.high)));
  const lo20=Math.min(...rows.slice(-20).map(x=>n(x.low)));
  const hi60=Math.max(...rows.slice(-60).map(x=>n(x.high)));
  const dist20=(last/hi20-1)*100, draw60=(last/hi60-1)*100;

  const R=rsi(c);
  const e12=ema(c,12), e26=ema(c,26);
  const mac=e12.at(-1)-e26.at(-1), macPrev=e12.at(-2)-e26.at(-2);
  const macUp=mac>macPrev;

  const A=atr(rows), atrp=A/last*100;
  const sd=Math.sqrt(avg(c.slice(-20).map(x=>(x-s20)**2)));
  const bbw=(4*sd/s20)*100;
  const mom5=(last/c.at(-6)-1)*100;
  const O=obv(rows);
  const rangePos=(last-lo20)/(Math.max(...rows.slice(-20).map(x=>n(x.high)))-lo20)*100;

  // 현재 일봉 거래량이 지나치게 작으면 미완성 데이터일 수 있어 직전 완성봉도 함께 확인
  const partialVolumeSuspect = rv20 < 0.15;
  const effectiveRvol = partialVolumeSuspect ? Math.max(rv20, prevRv20*0.85) : rv20;

  let flowScore=0, setupScore=0, riskScore=0;
  let reasons=[], risks=[];

  // 1) 자금유입 점수: 가장 높은 비중
  if(effectiveRvol>=5){flowScore+=40;reasons.push("거래량 폭발 "+effectiveRvol.toFixed(1)+"배")}
  else if(effectiveRvol>=3){flowScore+=34;reasons.push("거래량 매우 강함 "+effectiveRvol.toFixed(1)+"배")}
  else if(effectiveRvol>=1.8){flowScore+=27;reasons.push("거래량 급증 "+effectiveRvol.toFixed(1)+"배")}
  else if(effectiveRvol>=1.2){flowScore+=19;reasons.push("거래량 유입 "+effectiveRvol.toFixed(1)+"배")}
  else if(effectiveRvol>=0.8){flowScore+=8;risks.push("거래량 아직 보통")}
  else if(effectiveRvol>=0.5){flowScore+=2;risks.push("거래량 부족")}
  else {flowScore-=18;risks.push("거래량 극저조")}

  if(volTrend>=1.15){flowScore+=8;reasons.push("최근 5일 거래량 증가")}
  if(O.up){flowScore+=9;reasons.push("OBV 매수우위")}
  else {flowScore-=6;risks.push("OBV 약세")}

  // 2) 차트 준비도: 이미 폭등한 종목보다 '직전' 구간 우대
  if(last>s20){setupScore+=8;reasons.push("20일선 위")} else setupScore-=5;
  if(s20>s50){setupScore+=8;reasons.push("20·50일 추세 우위")}
  if(dist20>=0 && dist20<=4){setupScore+=14;reasons.push("20일 고점 돌파")}
  else if(dist20>-4){setupScore+=13;reasons.push("20일 고점 바로 아래")}
  else if(dist20>-10){setupScore+=7;reasons.push("20일 고점 접근")}

  if(macUp&&mac>0){setupScore+=10;reasons.push("MACD 양전환/상승")}
  else if(macUp){setupScore+=6;reasons.push("MACD 회복")}
  else setupScore-=4;

  if(R>=48&&R<=66){setupScore+=9;reasons.push("RSI "+R.toFixed(0)+" 과열 전")}
  else if(R>=40&&R<48){setupScore+=4}
  else if(R>76){riskScore+=18;risks.push("RSI 과열")}

  if(mom5>=1&&mom5<=18){setupScore+=8;reasons.push("5일 모멘텀 +"+mom5.toFixed(1)+"%")}
  else if(mom5>30){riskScore+=12;risks.push("5일 급등 과열")}
  else if(mom5<-15){riskScore+=8;risks.push("5일 추세 약화")}

  if(bbw>=7&&bbw<=28){setupScore+=5;reasons.push("볼린저 폭 적정/확장")}
  if(atrp>=3.5&&atrp<=13){setupScore+=6;reasons.push("파동폭 적정")}
  else if(atrp>20){riskScore+=15;risks.push("변동성 과다")}

  if(dayChg>28){riskScore+=12;risks.push("당일 급등 추격주의")}
  if(dayChg>45){riskScore+=15}
  if(dayChg<-18){riskScore+=12;risks.push("당일 급락")}

  // 자금이 실제로 붙지 않으면 높은 등급 차단
  const moneyFlowPass = effectiveRvol>=1.2 && O.up;
  const watchPass = effectiveRvol>=0.8 && (O.up||macUp);
  const hardFail = effectiveRvol<0.5 || R>82 || atrp>26 || dayChg>55 || dayChg<-30;

  // 큰파동 가능성 / 진입매력 / 위험도 분리
  const surgePotential=Math.max(0,Math.min(100,Math.round(
    flowScore*1.35 + setupScore*0.72 - riskScore*0.7
  )));
  const entryAppeal=Math.max(0,Math.min(100,Math.round(
    setupScore*1.55 + Math.min(flowScore,35)*0.55 - riskScore*0.9
  )));
  const dangerScore=Math.max(0,Math.min(100,Math.round(
    riskScore*2.15 + (effectiveRvol<0.8?18:0) + (!O.up?10:0)
  )));

  let score=Math.round(surgePotential*0.62 + entryAppeal*0.38 - dangerScore*0.18);
  score=Math.max(0,Math.min(100,score));

  // 강제 상한: HOLO처럼 거래량이 거의 없는데 A+가 뜨지 않게
  if(hardFail) score=Math.min(score,49);
  else if(!watchPass) score=Math.min(score,57);
  else if(!moneyFlowPass) score=Math.min(score,64);

  const grade=score>=85?"S":score>=75?"A+":score>=65?"A":score>=55?"B+":"관망";
  const stance=hardFail?"자동탈락/관망":
               moneyFlowPass&&score>=78?"강한 후보":
               moneyFlowPass&&score>=68?"눌림/돌파 감시":
               watchPass&&score>=58?"관찰 후보":"거래량 대기";

  const support=Math.max(lo20,Math.min(s20,last-A));
  const entryLow=Math.max(0.01,Math.min(last,s20)*0.985);
  const entryHigh=Math.max(last,s20)*1.01;
  const stop=Math.max(0.01,Math.min(support,last-A*1.5));
  const t1=last+1.8*A, t2=last+3*A, t3=last+4.5*A;
  const pump=Math.max(0,Math.min(999,effectiveRvol*Math.max(1,Math.abs(dayChg)+5)/10));

  const surgeCatch = moneyFlowPass && !hardFail && (
    (score>=72 && macUp && mom5>-5) ||
    (dist20>-4 && effectiveRvol>=1.8)
  );
  const volumeSpike = effectiveRvol>=1.8;

async function loadAllUSStocks(){

async function discoverMarketCandidates(min,max){
  // 1) 가장 좋은 경로: Twelve Data Market Movers.
  // 플랜에서 지원되지 않으면 2) 전체 미국주식 심볼 목록 자동회전으로 fallback.
  try{
    setStatus("🌎 미국시장 Market Movers 후보 불러오는 중…");
    const m=await api("/market_movers/stocks",{direction:"gainers",country:"United States",outputsize:40});
    const vals=m.values||m.data||[];
    if(vals.length){
      let cands=vals.map(x=>{
        const sym=String(x.symbol||"").toUpperCase();
        const nm=x.name||x.instrument_name||sym;
        const last=n(x.last||x.price||x.close);
        const pct=n(x.percent_change||x.change_percent||x.change);
        return {sym,nm,last,pct};
      }).filter(x=>x.sym);

      // 가격이 endpoint에서 제공되면 동전주만 먼저 거름.
      const priced=cands.filter(x=>Number.isFinite(x.last)&&x.last>=min&&x.last<=max);
      if(priced.length>=5) cands=priced;
      // 이미 너무 폭등한 종목은 뒤로 보내고, 아직 초중반인 종목 우선
      cands.sort((a,b)=>{
        const pa=Number.isFinite(a.pct)?Math.abs(a.pct-12):99;
        const pb=Number.isFinite(b.pct)?Math.abs(b.pct-12):99;
        return pa-pb;
      });
      return {mode:"market_movers",list:cands.slice(0,16).map(x=>[x.sym,x.nm])};
    }
  }catch(e){
    console.log("Market movers unavailable",e);
  }

  // 무료 플랜 fallback: 고정 티커가 아니라, 매일 갱신되는 전체 미국주식 심볼 목록에서 순환
  const all=await loadAllUSStocks();
  let cursor=0;
  try{cursor=Number(localStorage.getItem("us_universe_cursor_v34")||0)}catch(e){}
  const picks=[];
  const step=97; // 같은 섹터/알파벳에 몰리지 않도록 건너뛰며 선택
  for(let i=0;i<16 && all.length;i++){
    picks.push(all[(cursor+i*step)%all.length]);
  }
  try{localStorage.setItem("us_universe_cursor_v34",String((cursor+16*step)%all.length))}catch(e){}
  return {mode:"full_symbol_fallback",list:picks};
}

async function analyzeOne(sym,name=""){

  if(!ts.values||ts.values.length<61) throw Error("분석 가능한 일봉 데이터 부족");

async function runBatch(batch,min,max,label="정밀 분석"){
  const res=[],errors=[];
  for(let i=0;i<batch.length;i++){
    const [sym,name]=batch[i];
    try{
      setStatus(`${label} ${i+1}/${batch.length} · ${sym}`);
      const z=await analyzeOne(sym,name);
      const isRadar=getRadar().includes(sym);
      if((z.last>=min&&z.last<=max)||isRadar) res.push(z);
    }catch(e){ errors.push(sym+": "+e.message); }
  }
  return {res,errors};
}

}

$("marketBtn").onclick=async()=>{
  if(!key()){setStatus("API 키를 먼저 확인해줘.","err");return}
  const min=n($("minp").value), max=n($("maxp").value);
  $("out").innerHTML="";
  try{
    const d=await discoverMarketCandidates(min,max);
    let candidates=d.list;
    const radar=getRadar().map(sym=>[sym,sym]);
    const seen=new Set();
    candidates=[...radar,...candidates].filter(x=>{
      const sym=String(x[0]).toUpperCase();
      if(seen.has(sym)) return false;
      seen.add(sym); return true;
    }).slice(0,24);
    if(!candidates.length) throw Error("시장 후보를 불러오지 못했어.");

    let all=[];
    const groups=[];
    for(let i=0;i<candidates.length;i+=8) groups.push(candidates.slice(i,i+8));

    for(let g=0;g<groups.length;g++){
      const r=await runBatch(groups[g],min,max,`시장 자동발굴 ${g*8+1}~${Math.min((g+1)*8,candidates.length)}`);
      all.push(...r.res);
      if(g<groups.length-1){
        for(let sec=60;sec>0;sec--){
          setStatus(`API 제한 안전 대기 중… 다음 시장후보까지 ${sec}초`);
          await sleep(1000);
        }
      }
    }

    // v3.5 실전 시장포착 점수:
    // "아무 종목 중 1등"을 없애고 실제 자금 유입 + 준비도 + 과열 위험을 함께 본다.
    all.forEach(x=>{
      const rvol=Math.max(0,Number(x.effectiveRvol)||0);
      const flowBonus=Math.min(18,Math.max(0,(rvol-1)*12));
      const triggerBonus=(x.dayChg>=2 && x.dayChg<=22 ? 5:0) + (x.R>=48 && x.R<=72 ? 4:0);
      x.marketDiscoveryScore=Math.max(0,Math.min(100,Math.round(
        x.score*0.28 + x.explosionScore*0.34 + x.surgePotential*0.18 +
        flowBonus + triggerBonus - x.dangerScore*0.15
      )));
      x.livePass = !x.hardFail
        && rvol >= 1.20
        && x.marketDiscoveryScore >= 65
        && x.score >= 58
        && x.explosionScore >= 62
        && x.R < 76
        && x.dayChg < 30;
    });

    // 최소 기준 미달 종목은 #1/#2로 강제 표시하지 않는다.
    let filtered=all.filter(x=>x.livePass);
    filtered.sort((a,b)=>
      (b.marketDiscoveryScore-a.marketDiscoveryScore) ||
      (b.effectiveRvol-a.effectiveRvol) ||
      (b.explosionScore-a.explosionScore)
    );
    const shown=filtered.slice(0,6);

    const radarSet=new Set(getRadar());
    const outOfRangeStrong=all.filter(x=>
      radarSet.has(x.sym) &&
      (x.last<min || x.last>max) &&
      (x.score>=70 || x.surgePotential>=80 || x.explosionScore>=75)
    ).sort((a,b)=>b.score-a.score).slice(0,5);

    if(shown.length){
      $("out").innerHTML=marketBanner(d.mode,shown,all.length)+radarHtml()+
        `<div class="marketbox"><b>✅ 실전 통과 기준</b><div class="modehint">상대거래량 ≥ 1.20x · 시장포착 ≥ 65 · AI ≥ 58 · 폭발직전 ≥ 62 · RSI &lt; 76 · 당일 +30% 미만</div></div>`+
        shown.map((x,i)=>card(x,i)).join("")+
        (outOfRangeStrong.length?`<div class="marketbox"><b>⭐ 가격범위 밖 강력후보</b><div class="modehint">${outOfRangeStrong.map(x=>`${x.sym} ${money(x.last)} · AI ${x.score} · 급등 ${x.surgePotential}`).join("<br>")}</div></div>`:"");
      setStatus(`완료 ✅ ${all.length}종목 정밀분석 → 실전 기준 통과 ${shown.length}종목`,"ok");
    }else{
      $("out").innerHTML=marketBanner(d.mode,shown,all.length)+radarHtml()+
        `<div class="marketbox" style="border-color:#71422f;background:#241711"><b style="color:#ffd0ad">오늘 강한 후보 없음</b><div class="modehint">이번 후보군에서는 상대거래량 1.20x + 시장포착 65점 등 최소 기준을 동시에 통과한 종목이 없었어.<br>약한 종목을 억지로 #1로 표시하지 않아. 다시 누르면 다음 후보군을 검사해.</div></div>`;
      setStatus("오늘 강한 후보 없음 · 약한 종목은 TOP 후보에서 제외했어.","err");
    }
  }catch(e){
    setStatus("전체시장 자동발굴 실패: "+e.message,"err");
  }
};
